spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# HS256 서명 키. 32바이트 이상을 Base64로 넣는다 (openssl rand -base64 32).
app.jwt.secret=${JWT_SECRET}

# 인증번호 메일. SPRING_MAIL_HOST 등이 없으면 서버가 시작하지 않는다.
# 로컬 개발은 MAIL_LOG_CODES=true로 메일 대신 로그에 인증번호를 남긴다. 운영에서는 켜지 않는다.
app.mail.from=${MAIL_FROM:no-reply@codingmon.local}
app.mail.log-codes=${MAIL_LOG_CODES:false}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 메일 서버가 응답하지 않을 때 무한정 기다리지 않는다(밀리초).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 운영은 ALB 뒤에 있으므로 X-Forwarded-For에서 사용자 IP를 꺼낸다(IP별 발송 제한용).
# Tomcat은 내부망 주소(10.x, 172.16~31.x, 192.168.x, 127.x)에서 온 헤더만 믿어, 외부에서 위조한 값은 무시한다.
server.forward-headers-strategy=native

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
