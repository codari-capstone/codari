spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# HS256 서명 키. 32바이트 이상을 Base64로 넣는다 (openssl rand -base64 32).
app.jwt.secret=${JWT_SECRET}

# 인증번호 메일. SPRING_MAIL_HOST 등을 넣지 않으면 메일 대신 로그에 인증번호를 남긴다(로컬 개발용).
app.mail.from=${MAIL_FROM:no-reply@codingmon.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 운영은 ALB 뒤에 있으므로 X-Forwarded-For에서 사용자 IP를 꺼낸다(IP별 발송 제한용).
# Tomcat은 내부망 주소(10.x, 172.16~31.x, 192.168.x, 127.x)에서 온 헤더만 믿어, 외부에서 위조한 값은 무시한다.
server.forward-headers-strategy=native

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
