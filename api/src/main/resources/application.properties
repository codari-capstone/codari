spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# HS256 서명 키. 32바이트 이상을 Base64로 넣는다 (openssl rand -base64 32).
app.jwt.secret=${JWT_SECRET}

# 인증번호 메일. SPRING_MAIL_HOST 등이 없으면 서버가 시작하지 않는다.
# 로컬 개발은 MAIL_LOG_CODES=true로 메일 대신 로그에 인증번호를 남긴다. 운영에서는 켜지 않는다.
app.mail.from=${MAIL_FROM:no-reply@codingmon.local}
app.mail.log-codes=${MAIL_LOG_CODES:false}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 암호화가 안 되면 보내지 않는다. 계정 비밀번호와 인증번호가 평문으로 나가지 않게 한다.
spring.mail.properties.mail.smtp.starttls.required=true
# 메일 서버가 응답하지 않을 때 무한정 기다리지 않는다(밀리초).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 운영은 ALB 뒤에 있으므로 X-Forwarded-For에서 사용자 IP를 꺼낸다(IP별 발송 제한용).
# Tomcat은 내부망 주소(10.x, 172.16~31.x, 192.168.x, 127.x)에서 온 헤더만 믿어, 외부에서 위조한 값은 무시한다.
server.forward-headers-strategy=native

# GitHub 로그인(OAuth App). 비워 두면 GitHub 로그인을 쓸 수 없다.
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
# GitHub 로그인을 마치고 돌아갈 웹 주소. 없으면 서버가 시작하지 않는다(운영에서 빠뜨리면 localhost로 보내지 않게).
app.web.base-url=${WEB_BASE_URL}

# 채점 서버(Judge0, judge/README.md). 비워 두면 채점 처리기가 돌지 않아 제출과 예제 실행이 QUEUED로 남는다.
app.judge0.url=${JUDGE0_URL:}
# judge/.env의 AUTHN_TOKEN과 같은 값
app.judge0.authn-token=${JUDGE0_AUTHN_TOKEN:}
app.judge0.connect-timeout=${JUDGE0_CONNECT_TIMEOUT:3s}
app.judge0.read-timeout=${JUDGE0_READ_TIMEOUT:10s}

# LLM(팀 서버의 오픈 웨이트 모델). OpenAI 호환 API를 주는 엔진이면 된다. 비워 두면 AI 기능이 장애로 응답한다.
app.llm.url=${LLM_URL:}
app.llm.model=${LLM_MODEL:}
# 엔진에 API 키를 걸었을 때만 넣는다
app.llm.api-key=${LLM_API_KEY:}
# ai_reviews.prompt_version. 프롬프트를 고치면 그 기능의 값만 올려서 이전 결과를 재사용하지 않게 한다
app.llm.prompt-version.analysis=${LLM_PROMPT_VERSION_ANALYSIS:v1}
app.llm.prompt-version.code-review=${LLM_PROMPT_VERSION_CODE_REVIEW:v1}
app.llm.connect-timeout=${LLM_CONNECT_TIMEOUT:3s}
app.llm.read-timeout=${LLM_READ_TIMEOUT:120s}
app.llm.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:4096}
# 동시에 모델을 부르는 수. 채점 슬롯과 별개다. 모델 서버의 처리량을 잰 뒤 늘린다
app.llm.workers=${LLM_WORKERS:1}
# 실행을 기다릴 수 있는 요청 수. 차면 바로 RATE_LIMITED로 돌려준다
app.llm.queue-capacity=${LLM_QUEUE_CAPACITY:20}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# 관리자 테스트케이스 ZIP 읽기(#34). ZIP 파일은 10MiB까지 받는다(Spring의 MB는 1024×1024바이트). 넘으면 413.
# 요청 전체 상한은 RequestSizeLimitFilter가 먼저 본다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
