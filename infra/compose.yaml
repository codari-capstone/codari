# codingmon 서비스(웹·API·DB)를 한 서버에 올리는 Compose 파일. Judge0는 채점 VM에 따로 띄운다(judge/).
# 사용법은 infra/README.md. 비밀값은 같은 폴더의 .env에서 받는다(.env.example 참고).

name: codingmon

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: codingmon
      POSTGRES_USER: codingmon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?infra/.env에 DB_PASSWORD가 필요하다}
    volumes:
      # PostgreSQL 18 이미지는 데이터를 /var/lib/postgresql/18/docker에 둔다. 상위 폴더를 볼륨으로 잡는다
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U codingmon -d codingmon"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always
    <<: *default-logging

  api:
    image: codingmon-api:${TAG:-latest}
    build: ../api
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/codingmon
      DB_USERNAME: codingmon
      # certs/에 둔 인증서를 JVM truststore에 더한다. TLS를 검사하는 프록시가 없으면 폴더를 비워 둔다
      USE_SYSTEM_CA_CERTS: "1"
    volumes:
      - ./certs:/certificates:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always
    <<: *default-logging

  web:
    image: codingmon-web:${TAG:-latest}
    build: ../web
    ports:
      # 앞단 HTTPS 프록시가 같은 서버에 있으면 127.0.0.1로 둔다
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: always
    <<: *default-logging

  # Cloudflare Tunnel. 들어오는 포트를 열지 않고, Cloudflare로 나가는 연결 하나로 웹을 HTTPS 주소에 공개한다.
  # .env에 TUNNEL_TOKEN을 넣고 `docker compose --profile tunnel up -d`로 켠다. 공개 주소는 Cloudflare 대시보드에서 web:80으로 잇는다
  tunnel:
    image: cloudflare/cloudflared:2026.10.5
    profiles: [tunnel]
    # TLS를 검사하는 프록시 뒤라면 TCP(http2)는 인증서 오류가 나므로 TUNNEL_PROTOCOL=quic(UDP 7844)으로 고정한다
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: always
    <<: *default-logging

volumes:
  db:
