openapi: 3.1.0
info:
  title: codingmon API
  version: 0.1.0
  description: |
    인증: 로그인하면 access token(JWT, 30분)을 응답 본문으로, refresh token(7일)을
    `refresh_token` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/auth)로 준다.
    프런트는 access token을 메모리에만 두고 `Authorization: Bearer <token>`으로 보낸다.
    access token이 만료되거나 비밀번호 재설정으로 무효가 되면 401을 받는다. 그러면
    `POST /api/auth/refresh`로 갱신하고, 갱신도 401이면 로그인 화면으로 보낸다 (COM-04).

    권한 (COM-05): 비로그인은 `GET /api/problems`(목록), `GET /api/concept-tags`만 쓸 수 있다.
    문제 상세(지문)는 로그인해야 본다.
    `/api/admin/**`는 ADMIN만 쓸 수 있다. 나머지는 로그인이 필요하다.

    오류 응답은 RFC 9457 `application/problem+json`이다.

servers:
  - url: /

paths:
  /api/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: access token 갱신 (COM-04)
      description: |
        refresh token 쿠키로 새 access token을 받는다. refresh token도 새 값으로 바뀐다.
        바뀐 지 10초 안의 refresh token을 다시 보내면 다른 탭이 먼저 갱신한 경우로 보고 401만 준다.
        프런트는 탭끼리 갱신을 한 번에 하나씩 한다(Web Locks `navigator.locks.request`). 앞 탭의 응답으로
        쿠키가 바뀐 뒤 다음 탭이 요청하므로, 같은 토큰을 동시에 보내 401을 받는 일이 없다.
        그보다 오래된 refresh token을 다시 보내면 탈취로 보고, 같은 로그인에서 나온 토큰을 모두 폐기한다.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 새 refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/signup/email-code:
    post:
      operationId: sendSignupCode
      summary: 회원가입 인증번호 발송 (COM-06)
      description: |
        6자리 인증번호를 메일로 보낸다. 5분 뒤 만료되고, 다시 보내면 이전 번호는 무효다.
        이메일 형식이 틀리면 400 `INVALID_EMAIL`. 이미 가입된 이메일이면 보내지 않고 409 `EMAIL_TAKEN`을 준다.
        제한: 같은 이메일 1분 간격·하루 5회(UTC), 같은 IP 하루 20회. 걸리면 429 `TOO_MANY_REQUESTS`.
        메일 서버 오류로 발송에 실패하면 503 `MAIL_FAILED`. 번호는 만들어진 채라 1분 뒤 다시 받아야 하고, 하루 5회에도 센다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 발송함
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/signup/email-code/verify:
    post:
      operationId: verifySignupCode
      summary: 회원가입 인증번호 확인 (COM-06)
      description: |
        맞으면 30분 동안 쓸 수 있는 `verificationToken`을 준다. 가입 완료 때 이 값을 보낸다.
        오류 `code`: `INVALID_EMAIL`, `CODE_MISMATCH`(틀림), `CODE_ATTEMPTS_EXCEEDED`(5회 틀려 무효), `CODE_EXPIRED`(만료 또는 받은 번호 없음).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken]
                properties:
                  verificationToken:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/nickname-availability:
    get:
      operationId: checkNicknameAvailability
      summary: 닉네임 중복 확인 (COM-06)
      description: 안내용이며 닉네임을 미리 점유하지 않는다. 대소문자를 구분하지 않는다. 규칙에 맞지 않으면 400 `INVALID_NICKNAME`.
      tags: [auth]
      security: []
      parameters:
        - in: query
          name: nickname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/signup:
    post:
      operationId: signUp
      summary: 이메일 회원가입 완료 (COM-06)
      description: |
        가입만 하고 로그인시키지 않는다. 웹은 가입 완료 후 로그인 화면으로 보낸다.
        오류 `code`: `VERIFICATION_EXPIRED`(인증 후 30분 지남, 이메일 다시 인증), `INVALID_NICKNAME`, `INVALID_PASSWORD`,
        `PASSWORD_MISMATCH`, `NICKNAME_TAKEN`(그 사이 선점됨, 닉네임만 다시 입력), `EMAIL_TAKEN`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, nickname, password, passwordConfirm]
              properties:
                verificationToken:
                  type: string
                nickname:
                  type: string
                  description: 2~16자, 한글·영문·숫자
                password:
                  type: string
                  description: 10~20자, 영문 대문자·소문자·숫자·특수문자 각 1개 이상
                passwordConfirm:
                  type: string
      responses:
        '204':
          description: 가입 완료
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/auth/login:
    post:
      operationId: login
      summary: 이메일 로그인 (COM-07)
      description: |
        실패하면 이유와 관계없이 401 `LOGIN_FAILED`와 같은 문구를 준다.
        같은 이메일로 5회 연속 실패하면 5분 동안 429 `LOGIN_LOCKED`. 가입되지 않은 이메일도 같다.
        프런트는 이 401로 토큰 갱신을 시도하지 않는다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/TokensIssued'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (COM-03)
      description: 이 기기의 refresh token을 폐기하고 쿠키를 지운다. 쿠키가 없거나 모르는 토큰이어도 204.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema:
            type: string
      responses:
        '204':
          description: 로그아웃됨

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 화면이 경우를 나눌 때 쓰는 오류 코드. `detail`은 화면에 그대로 보여 줄 문구다.

  responses:
    TokensIssued:
      description: 로그인됨. access token은 본문, refresh token은 쿠키로 준다.
      headers:
        Set-Cookie:
          description: refresh token
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenResponse'

    Problem:
      description: 요청을 처리하지 못함. `code`와 `detail`을 본다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: 토큰이 없거나 유효하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

security:
  - bearerAuth: []
