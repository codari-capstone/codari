openapi: 3.1.0
info:
  title: codingmon API
  version: 0.1.0
  description: |
    인증: 로그인하면 access token(JWT, 30분)을 응답 본문으로, refresh token(7일)을
    `refresh_token` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/auth)로 준다.
    프런트는 access token을 메모리에만 두고 `Authorization: Bearer <token>`으로 보낸다.
    access token이 만료되거나 비밀번호 재설정으로 무효가 되면 401을 받는다. 그러면
    `POST /api/auth/refresh`로 갱신하고, 갱신도 401이면 로그인 화면으로 보낸다 (COM-04).

    권한 (COM-05): 비로그인은 `GET /api/problems`(목록), `GET /api/concept-tags`만 쓸 수 있다.
    문제 상세(지문)는 로그인해야 본다.
    `/api/admin/**`는 ADMIN만 쓸 수 있다. 나머지는 로그인이 필요하다.

    오류 응답은 RFC 9457 `application/problem+json`이다.

servers:
  - url: /

paths:
  /api/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: access token 갱신 (COM-04)
      description: |
        refresh token 쿠키로 새 access token을 받는다. refresh token도 새 값으로 바뀐다.
        바뀐 지 10초 안의 refresh token을 다시 보내면 다른 탭이 먼저 갱신한 경우로 보고 401만 준다.
        프런트는 탭끼리 갱신을 한 번에 하나씩 한다(Web Locks `navigator.locks.request`). 앞 탭의 응답으로
        쿠키가 바뀐 뒤 다음 탭이 요청하므로, 같은 토큰을 동시에 보내 401을 받는 일이 없다.
        그보다 오래된 refresh token을 다시 보내면 탈취로 보고, 같은 로그인에서 나온 토큰을 모두 폐기한다.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 새 refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/signup/email-code:
    post:
      operationId: sendSignupCode
      summary: 회원가입 인증번호 발송 (COM-06)
      description: |
        6자리 인증번호를 메일로 보낸다. 5분 뒤 만료되고, 다시 보내면 이전 번호는 무효다.
        이메일 형식이 틀리면 400 `INVALID_EMAIL`. 이미 가입된 이메일이면 보내지 않고 409 `EMAIL_TAKEN`을 준다.
        제한: 같은 이메일 1분 간격·하루 5회(UTC), 같은 IP 하루 20회. 걸리면 429 `TOO_MANY_REQUESTS`.
        메일 서버 오류로 발송에 실패하면 503 `MAIL_FAILED`. 번호는 만들어진 채라 1분 뒤 다시 받아야 하고, 하루 5회에도 센다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 발송함
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/signup/email-code/verify:
    post:
      operationId: verifySignupCode
      summary: 회원가입 인증번호 확인 (COM-06)
      description: |
        맞으면 30분 동안 쓸 수 있는 `verificationToken`을 준다. 가입 완료 때 이 값을 보낸다.
        오류 `code`: `INVALID_EMAIL`, `CODE_MISMATCH`(틀림), `CODE_ATTEMPTS_EXCEEDED`(5회 틀려 무효), `CODE_EXPIRED`(만료 또는 받은 번호 없음).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken]
                properties:
                  verificationToken:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/nickname-availability:
    get:
      operationId: checkNicknameAvailability
      summary: 닉네임 중복 확인 (COM-06)
      description: 안내용이며 닉네임을 미리 점유하지 않는다. 대소문자를 구분하지 않는다. 규칙에 맞지 않으면 400 `INVALID_NICKNAME`.
      tags: [auth]
      security: []
      parameters:
        - in: query
          name: nickname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/signup:
    post:
      operationId: signUp
      summary: 이메일 회원가입 완료 (COM-06)
      description: |
        가입만 하고 로그인시키지 않는다. 웹은 가입 완료 후 로그인 화면으로 보낸다.
        오류 `code`: `VERIFICATION_EXPIRED`(인증 후 30분 지남, 이메일 다시 인증), `INVALID_NICKNAME`, `INVALID_PASSWORD`,
        `PASSWORD_MISMATCH`, `NICKNAME_TAKEN`(그 사이 선점됨, 닉네임만 다시 입력), `EMAIL_TAKEN`.
        `EMAIL_TAKEN`을 뺀 입력값 오류는 verificationToken을 쓰지 않으므로 인증 후 30분 안에는 값만 고쳐 같은 verificationToken으로 다시 보낼 수 있다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, nickname, password, passwordConfirm]
              properties:
                verificationToken:
                  type: string
                nickname:
                  type: string
                  description: 2~16자, 한글·영문·숫자
                password:
                  type: string
                  description: 10~20자, 영문 대문자·소문자·숫자·특수문자 각 1개 이상
                passwordConfirm:
                  type: string
      responses:
        '204':
          description: 가입 완료
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/auth/login:
    post:
      operationId: login
      summary: 이메일 로그인 (COM-07)
      description: |
        실패하면 이유와 관계없이 401 `LOGIN_FAILED`와 같은 문구를 준다.
        같은 이메일로 5회 연속 실패하면 5분 동안 429 `LOGIN_LOCKED`. 가입되지 않은 이메일도 같다.
        프런트는 이 401로 토큰 갱신을 시도하지 않는다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/TokensIssued'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (COM-03)
      description: 이 기기의 refresh token을 폐기하고 쿠키를 지운다. 쿠키가 없거나 모르는 토큰이어도 204.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema:
            type: string
      responses:
        '204':
          description: 로그아웃됨

  /api/auth/password-reset/email-code:
    post:
      operationId: sendPasswordResetCode
      summary: 비밀번호 재설정 인증번호 발송 (COM-08)
      description: |
        일반 가입 계정에만 보낸다. 이메일 형식이 틀리면 400 `INVALID_EMAIL`. 가입되지 않은 이메일(GitHub 가입 계정 포함)이면 404 `EMAIL_NOT_FOUND`.
        인증번호 규칙과 발송 제한은 회원가입과 같고, 횟수는 가입과 따로 센다.
        메일 서버 오류로 발송에 실패하면 503 `MAIL_FAILED`(회원가입과 같음, 1분 뒤 다시 받아야 함).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 발송함
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/password-reset/email-code/verify:
    post:
      operationId: verifyPasswordResetCode
      summary: 비밀번호 재설정 인증번호 확인 (COM-08)
      description: |
        맞으면 10분 동안 쓸 수 있는 `resetToken`을 준다. 오류 `code`는 회원가입 인증번호 확인과 같다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [resetToken]
                properties:
                  resetToken:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: 새 비밀번호 설정 (COM-08)
      description: |
        비밀번호를 바꾸고 모든 기기에서 로그아웃시킨다(발급된 access·refresh token 모두 무효). 로그인은 다시 해야 한다.
        그 이메일에 걸린 로그인 잠금(`LOGIN_LOCKED`)도 풀려 새 비밀번호로 바로 로그인할 수 있다.
        오류 `code`: `RESET_EXPIRED`(인증 후 10분 지남 또는 이미 쓴 resetToken), `INVALID_PASSWORD`, `PASSWORD_MISMATCH`.
        `INVALID_PASSWORD`·`PASSWORD_MISMATCH`는 resetToken을 쓰지 않으므로 비밀번호만 고쳐 같은 resetToken으로 다시 보낼 수 있다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, password, passwordConfirm]
              properties:
                resetToken:
                  type: string
                password:
                  type: string
                  description: 10~20자, 영문 대문자·소문자·숫자·특수문자 각 1개 이상
                passwordConfirm:
                  type: string
      responses:
        '204':
          description: 재설정됨
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/github:
    get:
      operationId: startGitHubLogin
      summary: GitHub 로그인 시작 (COM-02)
      description: |
        브라우저를 이 주소로 이동시킨다(fetch가 아님). GitHub 인증 화면으로 보낸다. 이메일 권한은 요청하지 않는다.
        원래 보던 페이지는 웹이 이동 전에 기억해 두었다가, 돌아온 뒤 그 페이지로 보낸다.
        서버에 GitHub 설정(`GITHUB_CLIENT_ID`·`GITHUB_CLIENT_SECRET`)이 없으면 503 `GITHUB_UNAVAILABLE`.
      tags: [auth]
      security: []
      responses:
        '302':
          description: GitHub 인증 화면으로 이동
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/github/callback:
    get:
      operationId: gitHubLoginCallback
      summary: GitHub 로그인 콜백 (COM-02)
      description: |
        GitHub OAuth App에 등록하는 콜백 주소다. 처리 후 웹의 `/login/github?result=...`로 보낸다.
        - `success`: 이미 가입한 계정이라 로그인됨. 웹은 `POST /api/auth/refresh`로 access token을 받는다.
        - `signup`: 처음이라 닉네임 입력 화면을 보여 주고 `POST /api/auth/github/signup`을 호출한다(30분 안).
        - `error`: 로그인하지 못함. 로그인 화면에 실패를 알린다. 다음 경우가 모두 여기에 해당한다.
          - 사용자가 GitHub에서 취소했거나 `code`·`state`가 없음
          - `state`가 쿠키와 다름(다른 사이트가 시작한 로그인) 또는 `state` 쿠키 만료(시작 후 10분)
          - GitHub 토큰 발급 실패, GitHub 응답 시간 초과(5초), GitHub 오류 응답
          - 서버 처리 오류
      tags: [auth]
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: 웹으로 이동

  /api/auth/github/signup:
    post:
      operationId: gitHubSignUp
      summary: GitHub 가입 완료 (COM-02)
      description: |
        콜백이 남긴 쿠키로 GitHub 인증 결과를 확인하고, 닉네임만 받아 가입한다. 로그인시키지 않으므로 웹은 로그인 화면으로 보낸다. 비밀번호는 만들지 않는다.
        오류 `code`: `VERIFICATION_EXPIRED`(30분 지남, GitHub 로그인 다시), `INVALID_NICKNAME`,
        `NICKNAME_TAKEN`(그 사이 선점됨, 닉네임만 다시 입력), `ALREADY_REGISTERED`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
                  description: 2~16자, 한글·영문·숫자
      responses:
        '204':
          description: 가입 완료
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/users/me:
    get:
      operationId: getCurrentUser
      summary: 로그인한 사용자 정보 (COM-01, COM-05)
      description: |
        상단의 사용자 메뉴(닉네임)와 관리자 메뉴(`role`)에 쓴다. 닉네임은 바뀔 수 있어 토큰이 아니라 이 API로 받는다.
      tags: [users]
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems:
    get:
      operationId: listProblems
      summary: 문제 목록·검색·필터 (LIST-01~05)
      description: |
        공개된 문제만 보여 준다. 제목·난이도·태그는 공개된 버전의 값이다.
        비로그인도 쓸 수 있다. 로그인했으면(`Authorization` 헤더) 문제마다 `solveStatus`를 싣는다.
        토큰을 보냈는데 만료됐거나 무효면 비로그인으로 처리하지 않고 401을 준다. 갱신(COM-04) 뒤 다시 보낸다.
        같은 파라미터 안에서 값을 여러 개 주면 그중 하나라도 맞는 문제를 보여 주고(OR), 서로 다른 파라미터끼리는 모두 맞아야 한다(AND).
        항상 페이지로 나눠 준다. 마지막 페이지보다 큰 `page`는 빈 `content`를 준다(`totalElements`는 그대로).
      tags: [problems]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          description: 제목 부분 일치, 대소문자 무시. `%`·`_`도 글자로 찾는다.
          schema:
            type: string
        - in: query
          name: difficulty
          description: 반복 키로 여러 개 (`?difficulty=EASY&difficulty=HARD`)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Difficulty'
          style: form
          explode: true
        - in: query
          name: tag
          description: 개념 태그 `slug`. 반복 키로 여러 개
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: status
          description: 풀이 상태. 반복 키로 여러 개. 비로그인 요청이면 무시하고 이 조건 없이 준다(오류를 주지 않는다).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SolveStatus'
          style: form
          explode: true
        - in: query
          name: sort
          description: |
            `<필드>,<방향>`. 필드는 `id`(번호) 또는 `difficulty`(EASY < MEDIUM < HARD), 방향은 `asc` 또는 `desc`.
            `difficulty`로 정렬하면 같은 난이도 안에서는 번호 오름차순이다.
          schema:
            type: string
            default: id,asc
        - in: query
          name: page
          description: 0부터 센다
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: 문제 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          description: 모르는 `difficulty`·`status` 값, `sort` 형식 오류, `page`·`size` 범위 밖
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems/{id}:
    get:
      operationId: getProblem
      summary: 문제 상세 (SOLVE-01~04, SOLVE-06)
      description: |
        문제 풀이 화면에 쓴다. 공개된 버전의 지문·공개 예제·언어별 제한과 시작 코드를 준다.
        비공개 테스트 케이스와 정답 코드는 주지 않는다.
        표준 입력 읽기 예시(SOLVE-07)는 문제마다 다르지 않아 이 응답에 없다. 화면이 언어별 고정 문구로 보여 준다.
        오류 `code`: `PROBLEM_NOT_FOUND`(없는 문제 또는 공개된 버전이 없는 문제. 둘을 구분하지 않는다).
      tags: [problems]
      parameters:
        - in: path
          name: id
          required: true
          description: 목록의 `id`
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 문제 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailView'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'

  /api/submissions:
    post:
      operationId: submitCode
      summary: 코드 제출 (SOLVE-09)
      description: |
        제출을 채점 대기(`QUEUED`)로 저장하고 바로 답한다. 채점 상태와 판정은 결과 조회(#30)로 확인한다.
        문제의 지금 공개된 버전으로 채점한다. 제출할 때마다 새 제출로 저장해 시도 횟수를 센다.
        오류 `code`: `SOURCE_EMPTY`(빈 코드 또는 공백뿐), `SOURCE_TOO_LONG`(UTF-8 기준 64KB 초과), `PROBLEM_NOT_FOUND`(없는 문제 또는 공개된 버전이 없는 문제),
        `LANGUAGE_NOT_SUPPORTED`(지금 공개된 버전이 그 언어를 지원하지 않음. 열어 둔 화면 사이에 새 버전이 공개된 경우).
        모르는 언어, NUL 문자가 든 코드는 `code` 없는 400이다.
        요청 본문이 512KB를 넘으면 본문을 읽지 않고 413을 준다(모든 API 공통). 64KB 이내 코드는 JSON 이스케이프로 늘어나도 걸리지 않는다.
        `Content-Length`를 밝히지 않는 요청(chunked)은 이 검사를 거치지 않는다(#14에서 다룬다).
      tags: [submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemId, language, sourceCode]
              properties:
                problemId:
                  type: integer
                  format: int64
                  description: 문제 목록·상세의 `id`
                language:
                  $ref: '#/components/schemas/Language'
                sourceCode:
                  type: string
      responses:
        '202':
          description: 접수됨
          headers:
            Location:
              description: 이 제출의 결과 조회 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
                    description: 제출 번호
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          description: 요청 본문이 512KB를 넘음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/concept-tags:
    get:
      operationId: listConceptTags
      summary: 개념 태그 전체 (LIST-03 필터 선택지)
      description: |
        목록 필터와 상관없이 등록된 태그를 모두 준다. 문제 목록 결과에서 태그를 뽑으면 필터를 걸수록 선택지가 줄어들기 때문이다.
        비로그인도 쓸 수 있다. 토큰을 보냈는데 만료됐거나 무효면 401이다(`GET /api/problems`와 같다).
      tags: [problems]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 개념 태그 전체
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConceptTag'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CurrentUser:
      type: object
      required: [id, nickname, role]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        avatarUrl:
          type: [string, 'null']
          description: GitHub 가입 계정의 프로필 이미지. 없으면 null

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    Language:
      type: string
      enum: [PYTHON, CPP]

    SolveStatus:
      type: string
      enum: [SOLVED, WRONG, UNSOLVED]
      description: |
        내 풀이 상태 (LIST-01). 판정이 나온 채점 제출만 센다(예제 실행·채점 불가·채점 중인 제출은 세지 않는다).
        `SOLVED` 한 번이라도 맞음, `WRONG` 제출했지만 맞은 적 없음, `UNSOLVED` 제출 기록 없음.

    ConceptTag:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    ProblemSummary:
      type: object
      required: [id, slug, title, difficulty, tags]
      properties:
        id:
          type: integer
          format: int64
          description: 화면에 보여 주는 문제 번호
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ConceptTag'
        solveStatus:
          $ref: '#/components/schemas/SolveStatus'
          description: 로그인한 요청에만 있다. 비로그인이면 필드가 없다(`UNSOLVED`와 다르다).

    ProblemDetailView:
      type: object
      required: [id, slug, versionNo, title, difficulty, tags, statementMarkdown, inputDescription,
        outputDescription, constraintsMarkdown, sourceName, sourceUrl, license, samples, languages]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        versionNo:
          type: integer
          description: 공개된 버전의 번호 (SOLVE-03)
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ConceptTag'
        statementMarkdown:
          type: string
          description: 지문. Markdown과 수식
        inputDescription:
          type: string
          description: 입력 형식. Markdown과 수식
        outputDescription:
          type: string
          description: 출력 형식. Markdown과 수식
        constraintsMarkdown:
          type: string
          description: 제약 조건. 없으면 빈 문자열
        sourceName:
          type: [string, 'null']
        sourceUrl:
          type: [string, 'null']
        license:
          type: [string, 'null']
        samples:
          type: array
          description: 공개 예제. 순서대로
          items:
            type: object
            required: [input, output]
            properties:
              input:
                type: string
              output:
                type: string
        languages:
          type: array
          description: 쓸 수 있는 언어. PYTHON, CPP 순서
          items:
            type: object
            required: [language, timeLimitMs, memoryLimitMb, starterCode]
            properties:
              language:
                $ref: '#/components/schemas/Language'
              timeLimitMs:
                type: integer
              memoryLimitMb:
                type: integer
              starterCode:
                type: string
                description: 에디터의 시작 코드. 없으면 빈 문자열

    ProblemPage:
      type: object
      required: [content, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        totalElements:
          type: integer
          format: int64
          description: 페이지와 상관없이 조건에 맞는 문제 수

    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 화면이 경우를 나눌 때 쓰는 오류 코드. `detail`은 화면에 그대로 보여 줄 문구다.

  responses:
    TokensIssued:
      description: 로그인됨. access token은 본문, refresh token은 쿠키로 준다.
      headers:
        Set-Cookie:
          description: refresh token
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenResponse'

    Problem:
      description: 요청을 처리하지 못함. `code`와 `detail`을 본다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: 토큰이 없거나 유효하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

security:
  - bearerAuth: []
