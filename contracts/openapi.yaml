openapi: 3.1.0
info:
  title: codingmon API
  version: 0.1.0
  description: |
    인증: 로그인하면 access token(JWT, 30분)을 응답 본문으로, refresh token(7일)을
    `refresh_token` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/auth)로 준다.
    프런트는 access token을 메모리에만 두고 `Authorization: Bearer <token>`으로 보낸다.
    access token이 만료되거나 비밀번호 재설정으로 무효가 되면 401을 받는다. 그러면
    `POST /api/auth/refresh`로 갱신하고, 갱신도 401이면 로그인 화면으로 보낸다 (COM-04).

    권한 (COM-05): 비로그인은 `GET /api/problems`(목록), `GET /api/concept-tags`만 쓸 수 있다.
    문제 상세(지문)는 로그인해야 본다.
    `/api/admin/**`는 ADMIN만 쓸 수 있다. 나머지는 로그인이 필요하다.

    오류 응답은 RFC 9457 `application/problem+json`이다.

servers:
  - url: /

paths:
  /api/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: access token 갱신 (COM-04)
      description: |
        refresh token 쿠키로 새 access token을 받는다. refresh token도 새 값으로 바뀐다.
        바뀐 지 10초 안의 refresh token을 다시 보내면 다른 탭이 먼저 갱신한 경우로 보고 401만 준다.
        프런트는 탭끼리 갱신을 한 번에 하나씩 한다(Web Locks `navigator.locks.request`). 앞 탭의 응답으로
        쿠키가 바뀐 뒤 다음 탭이 요청하므로, 같은 토큰을 동시에 보내 401을 받는 일이 없다.
        그보다 오래된 refresh token을 다시 보내면 탈취로 보고, 같은 로그인에서 나온 토큰을 모두 폐기한다.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 새 refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/signup/email-code:
    post:
      operationId: sendSignupCode
      summary: 회원가입 인증번호 발송 (COM-06)
      description: |
        6자리 인증번호를 메일로 보낸다. 5분 뒤 만료되고, 다시 보내면 이전 번호는 무효다.
        이메일 형식이 틀리면 400 `INVALID_EMAIL`. 이미 가입된 이메일이면 보내지 않고 409 `EMAIL_TAKEN`을 준다.
        제한: 같은 이메일 1분 간격·하루 5회(UTC), 같은 IP 하루 20회. 걸리면 429 `TOO_MANY_REQUESTS`.
        메일 서버 오류로 발송에 실패하면 503 `MAIL_FAILED`. 번호는 만들어진 채라 1분 뒤 다시 받아야 하고, 하루 5회에도 센다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 발송함
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/signup/email-code/verify:
    post:
      operationId: verifySignupCode
      summary: 회원가입 인증번호 확인 (COM-06)
      description: |
        맞으면 30분 동안 쓸 수 있는 `verificationToken`을 준다. 가입 완료 때 이 값을 보낸다.
        오류 `code`: `INVALID_EMAIL`, `CODE_MISMATCH`(틀림), `CODE_ATTEMPTS_EXCEEDED`(5회 틀려 무효), `CODE_EXPIRED`(만료 또는 받은 번호 없음).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken]
                properties:
                  verificationToken:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/nickname-availability:
    get:
      operationId: checkNicknameAvailability
      summary: 닉네임 중복 확인 (COM-06)
      description: 안내용이며 닉네임을 미리 점유하지 않는다. 대소문자를 구분하지 않는다. 규칙에 맞지 않으면 400 `INVALID_NICKNAME`.
      tags: [auth]
      security: []
      parameters:
        - in: query
          name: nickname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/signup:
    post:
      operationId: signUp
      summary: 이메일 회원가입 완료 (COM-06)
      description: |
        가입만 하고 로그인시키지 않는다. 웹은 가입 완료 후 로그인 화면으로 보낸다.
        오류 `code`: `VERIFICATION_EXPIRED`(인증 후 30분 지남, 이메일 다시 인증), `INVALID_NICKNAME`, `INVALID_PASSWORD`,
        `PASSWORD_MISMATCH`, `NICKNAME_TAKEN`(그 사이 선점됨, 닉네임만 다시 입력), `EMAIL_TAKEN`.
        `EMAIL_TAKEN`을 뺀 입력값 오류는 verificationToken을 쓰지 않으므로 인증 후 30분 안에는 값만 고쳐 같은 verificationToken으로 다시 보낼 수 있다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, nickname, password, passwordConfirm]
              properties:
                verificationToken:
                  type: string
                nickname:
                  type: string
                  description: 2~16자, 한글·영문·숫자
                password:
                  type: string
                  description: 10~20자, 영문 대문자·소문자·숫자·특수문자 각 1개 이상
                passwordConfirm:
                  type: string
      responses:
        '204':
          description: 가입 완료
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/auth/login:
    post:
      operationId: login
      summary: 이메일 로그인 (COM-07)
      description: |
        실패하면 이유와 관계없이 401 `LOGIN_FAILED`와 같은 문구를 준다.
        같은 이메일로 5회 연속 실패하면 5분 동안 429 `LOGIN_LOCKED`. 가입되지 않은 이메일도 같다.
        프런트는 이 401로 토큰 갱신을 시도하지 않는다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/TokensIssued'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (COM-03)
      description: 이 기기의 refresh token을 폐기하고 쿠키를 지운다. 쿠키가 없거나 모르는 토큰이어도 204.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema:
            type: string
      responses:
        '204':
          description: 로그아웃됨

  /api/auth/password-reset/email-code:
    post:
      operationId: sendPasswordResetCode
      summary: 비밀번호 재설정 인증번호 발송 (COM-08)
      description: |
        일반 가입 계정에만 보낸다. 이메일 형식이 틀리면 400 `INVALID_EMAIL`. 가입되지 않은 이메일(GitHub 가입 계정 포함)이면 404 `EMAIL_NOT_FOUND`.
        인증번호 규칙과 발송 제한은 회원가입과 같고, 횟수는 가입과 따로 센다.
        메일 서버 오류로 발송에 실패하면 503 `MAIL_FAILED`(회원가입과 같음, 1분 뒤 다시 받아야 함).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: 발송함
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/password-reset/email-code/verify:
    post:
      operationId: verifyPasswordResetCode
      summary: 비밀번호 재설정 인증번호 확인 (COM-08)
      description: |
        맞으면 10분 동안 쓸 수 있는 `resetToken`을 준다. 오류 `code`는 회원가입 인증번호 확인과 같다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [resetToken]
                properties:
                  resetToken:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/password-reset:
    post:
      operationId: resetPassword
      summary: 새 비밀번호 설정 (COM-08)
      description: |
        비밀번호를 바꾸고 모든 기기에서 로그아웃시킨다(발급된 access·refresh token 모두 무효). 로그인은 다시 해야 한다.
        그 이메일에 걸린 로그인 잠금(`LOGIN_LOCKED`)도 풀려 새 비밀번호로 바로 로그인할 수 있다.
        오류 `code`: `RESET_EXPIRED`(인증 후 10분 지남 또는 이미 쓴 resetToken), `INVALID_PASSWORD`, `PASSWORD_MISMATCH`.
        `INVALID_PASSWORD`·`PASSWORD_MISMATCH`는 resetToken을 쓰지 않으므로 비밀번호만 고쳐 같은 resetToken으로 다시 보낼 수 있다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, password, passwordConfirm]
              properties:
                resetToken:
                  type: string
                password:
                  type: string
                  description: 10~20자, 영문 대문자·소문자·숫자·특수문자 각 1개 이상
                passwordConfirm:
                  type: string
      responses:
        '204':
          description: 재설정됨
        '400':
          $ref: '#/components/responses/Problem'

  /api/auth/github:
    get:
      operationId: startGitHubLogin
      summary: GitHub 로그인 시작 (COM-02)
      description: |
        브라우저를 이 주소로 이동시킨다(fetch가 아님). GitHub 인증 화면으로 보낸다. 이메일 권한은 요청하지 않는다.
        원래 보던 페이지는 웹이 이동 전에 기억해 두었다가, 돌아온 뒤 그 페이지로 보낸다.
        서버에 GitHub 설정(`GITHUB_CLIENT_ID`·`GITHUB_CLIENT_SECRET`)이 없으면 503 `GITHUB_UNAVAILABLE`.
      tags: [auth]
      security: []
      responses:
        '302':
          description: GitHub 인증 화면으로 이동
        '503':
          $ref: '#/components/responses/Problem'

  /api/auth/github/callback:
    get:
      operationId: gitHubLoginCallback
      summary: GitHub 로그인 콜백 (COM-02)
      description: |
        GitHub OAuth App에 등록하는 콜백 주소다. 처리 후 웹의 `/login/github?result=...`로 보낸다.
        - `success`: 이미 가입한 계정이라 로그인됨. 웹은 `POST /api/auth/refresh`로 access token을 받는다.
        - `signup`: 처음이라 닉네임 입력 화면을 보여 주고 `POST /api/auth/github/signup`을 호출한다(30분 안).
        - `error`: 로그인하지 못함. 로그인 화면에 실패를 알린다. 다음 경우가 모두 여기에 해당한다.
          - 사용자가 GitHub에서 취소했거나 `code`·`state`가 없음
          - `state`가 쿠키와 다름(다른 사이트가 시작한 로그인) 또는 `state` 쿠키 만료(시작 후 10분)
          - GitHub 토큰 발급 실패, GitHub 응답 시간 초과(5초), GitHub 오류 응답
          - 서버 처리 오류
      tags: [auth]
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: 웹으로 이동

  /api/auth/github/signup:
    post:
      operationId: gitHubSignUp
      summary: GitHub 가입 완료 (COM-02)
      description: |
        콜백이 남긴 쿠키로 GitHub 인증 결과를 확인하고, 닉네임만 받아 가입한다. 로그인시키지 않으므로 웹은 로그인 화면으로 보낸다. 비밀번호는 만들지 않는다.
        오류 `code`: `VERIFICATION_EXPIRED`(30분 지남, GitHub 로그인 다시), `INVALID_NICKNAME`,
        `NICKNAME_TAKEN`(그 사이 선점됨, 닉네임만 다시 입력), `ALREADY_REGISTERED`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
                  description: 2~16자, 한글·영문·숫자
      responses:
        '204':
          description: 가입 완료
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/users/me:
    get:
      operationId: getCurrentUser
      summary: 로그인한 사용자 정보 (COM-01, COM-05)
      description: |
        상단의 사용자 메뉴(닉네임)와 관리자 메뉴(`role`)에 쓴다. 닉네임은 바뀔 수 있어 토큰이 아니라 이 API로 받는다.
      tags: [users]
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems:
    get:
      operationId: listProblems
      summary: 문제 목록·검색·필터 (LIST-01~05)
      description: |
        공개된 문제만 보여 준다. 제목·난이도·태그는 공개된 버전의 값이다.
        비로그인도 쓸 수 있다. 로그인했으면(`Authorization` 헤더) 문제마다 `solveStatus`를 싣는다.
        토큰을 보냈는데 만료됐거나 무효면 비로그인으로 처리하지 않고 401을 준다. 갱신(COM-04) 뒤 다시 보낸다.
        같은 파라미터 안에서 값을 여러 개 주면 그중 하나라도 맞는 문제를 보여 주고(OR), 서로 다른 파라미터끼리는 모두 맞아야 한다(AND).
        항상 페이지로 나눠 준다. 마지막 페이지보다 큰 `page`는 빈 `content`를 준다(`totalElements`는 그대로).
      tags: [problems]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          description: 제목 부분 일치, 대소문자 무시. `%`·`_`도 글자로 찾는다.
          schema:
            type: string
        - in: query
          name: difficulty
          description: 반복 키로 여러 개 (`?difficulty=EASY&difficulty=HARD`)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Difficulty'
          style: form
          explode: true
        - in: query
          name: tag
          description: 개념 태그 `slug`. 반복 키로 여러 개
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: status
          description: 풀이 상태. 반복 키로 여러 개. 비로그인 요청이면 무시하고 이 조건 없이 준다(오류를 주지 않는다).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SolveStatus'
          style: form
          explode: true
        - in: query
          name: sort
          description: |
            `<필드>,<방향>`. 필드는 `id`(번호) 또는 `difficulty`(EASY < MEDIUM < HARD), 방향은 `asc` 또는 `desc`.
            `difficulty`로 정렬하면 같은 난이도 안에서는 번호 오름차순이다.
          schema:
            type: string
            default: id,asc
        - in: query
          name: page
          description: 0부터 센다
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: 문제 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          description: 모르는 `difficulty`·`status` 값, `sort` 형식 오류, `page`·`size` 범위 밖
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems/{id}:
    get:
      operationId: getProblem
      summary: 문제 상세 (SOLVE-01~04, SOLVE-06)
      description: |
        문제 풀이 화면에 쓴다. 공개된 버전의 지문·공개 예제·언어별 제한과 시작 코드를 준다.
        비공개 테스트 케이스와 정답 코드는 주지 않는다.
        표준 입력 읽기 예시(SOLVE-07)는 문제마다 다르지 않아 이 응답에 없다. 화면이 언어별 고정 문구로 보여 준다.
        오류 `code`: `PROBLEM_NOT_FOUND`(없는 문제 또는 공개된 버전이 없는 문제. 둘을 구분하지 않는다).
      tags: [problems]
      parameters:
        - in: path
          name: id
          required: true
          description: 목록의 `id`
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 문제 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailView'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'

  /api/submissions:
    post:
      operationId: submitCode
      summary: 코드 제출 (SOLVE-09)
      description: |
        제출을 채점 대기(`QUEUED`)로 저장하고 바로 답한다. 채점 상태와 판정은 결과 조회(#30)로 확인한다.
        문제의 지금 공개된 버전으로 채점한다. 제출할 때마다 새 제출로 저장해 시도 횟수를 센다.
        오류 `code`: `SOURCE_EMPTY`(빈 코드 또는 공백뿐), `SOURCE_TOO_LONG`(UTF-8 기준 64KB 초과), `PROBLEM_NOT_FOUND`(없는 문제 또는 공개된 버전이 없는 문제),
        `LANGUAGE_NOT_SUPPORTED`(지금 공개된 버전이 그 언어를 지원하지 않음. 열어 둔 화면 사이에 새 버전이 공개된 경우).
        모르는 언어, NUL 문자가 든 코드는 `code` 없는 400이다.
        요청 본문이 512KB를 넘으면 본문을 읽지 않고 413을 준다(모든 API 공통). 64KB 이내 코드는 JSON 이스케이프로 늘어나도 걸리지 않는다.
        `Content-Length`를 밝히지 않는 요청(chunked)은 이 검사를 거치지 않는다(#14에서 다룬다).
      tags: [submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemId, language, sourceCode]
              properties:
                problemId:
                  type: integer
                  format: int64
                  description: 문제 목록·상세의 `id`
                language:
                  $ref: '#/components/schemas/Language'
                sourceCode:
                  type: string
      responses:
        '202':
          description: 접수됨
          headers:
            Location:
              description: 이 제출의 결과 조회 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
                    description: 제출 번호
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          description: 요청 본문이 512KB를 넘음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/submissions/{id}:
    get:
      operationId: getSubmissionResult
      summary: 채점 상태·결과 (RES-01~06)
      description: |
        화면은 `status`가 `COMPLETED`나 `JUDGE_ERROR`가 될 때까지 주기적으로 부른다(폴링).
        로그인한 본인의 채점 제출만 볼 수 있다. 남의 제출·없는 제출·예제 실행은 모두 404 `SUBMISSION_NOT_FOUND`다. 번호를 바꿔 물어도 그 번호의 제출이 있는지 드러나지 않는다.
        비공개 테스트의 입력·출력과 몇 번째 테스트에서 틀렸는지는 주지 않는다. 진행률만 준다.
        판정과 런타임 에러 종류의 쉬운 설명은 화면이 가진다(`docs/AI_FEATURES.md` 10절).
      tags: [submissions]
      parameters:
        - name: id
          in: path
          required: true
          description: 제출 응답의 `id`
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 지금 상태. 채점이 끝나지 않았으면 판정·시간·메모리는 null이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'

  /api/sample-runs:
    post:
      operationId: runSamples
      summary: 예제 실행 (SOLVE-08)
      description: |
        작성한 코드를 문제의 공개 예제로만 실행하도록 대기(`QUEUED`)로 저장하고 바로 답한다. 결과는 예제 실행 결과(`GET /api/sample-runs/{id}`)로 확인한다.
        시도 횟수·풀이 상태·제출 기록에 들어가지 않는다.
        요청 본문과 오류는 코드 제출(`POST /api/submissions`)과 같다.
      tags: [submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemId, language, sourceCode]
              properties:
                problemId:
                  type: integer
                  format: int64
                  description: 문제 목록·상세의 `id`
                language:
                  $ref: '#/components/schemas/Language'
                sourceCode:
                  type: string
      responses:
        '202':
          description: 접수됨
          headers:
            Location:
              description: 이 예제 실행의 결과 조회 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
                    description: 예제 실행 번호
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          description: 요청 본문이 512KB를 넘음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/sample-runs/{id}:
    get:
      operationId: getSampleRunResult
      summary: 예제 실행 상태·예제별 결과 (SOLVE-08)
      description: |
        화면은 `status`가 `COMPLETED`나 `JUDGE_ERROR`가 될 때까지 주기적으로 부른다(폴링).
        로그인한 본인의 예제 실행만 볼 수 있다. 남의 것·없는 것·채점 제출은 모두 404 `SAMPLE_RUN_NOT_FOUND`다.
        예제의 입력·기대 출력은 담지 않는다. 화면은 문제 상세의 `samples`와 `ordinal`로 짝짓는다.
      tags: [submissions]
      parameters:
        - name: id
          in: path
          required: true
          description: 예제 실행 응답의 `id`
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 지금 상태. 끝나지 않았으면 판정은 null이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleRunResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'

  /api/concept-tags:
    get:
      operationId: listConceptTags
      summary: 개념 태그 전체 (LIST-03 필터 선택지)
      description: |
        목록 필터와 상관없이 등록된 태그를 모두 준다. 문제 목록 결과에서 태그를 뽑으면 필터를 걸수록 선택지가 줄어들기 때문이다.
        비로그인도 쓸 수 있다. 토큰을 보냈는데 만료됐거나 무효면 401이다(`GET /api/problems`와 같다).
      tags: [problems]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 개념 태그 전체
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConceptTag'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/problems:
    get:
      operationId: listAdminProblems
      summary: 관리자 문제 목록·검색 (ADM-01)
      description: |
        공개 전·비공개 문제까지 모두 준다. 번호 오름차순이다.
        목록의 상태 표시(작성 중·검증 중·공개·공개 중 수정·비공개)는 화면이 `latestStatus`와 `publishedVersionNo`로 정한다.
        예: `latestStatus`가 `DRAFT`이고 `publishedVersionNo`가 2면 "공개 v2 · 수정 중".
      tags: [admin]
      parameters:
        - in: query
          name: keyword
          description: 최신 버전 제목 부분 일치, 대소문자 무시. `%`·`_`도 글자로 찾는다.
          schema:
            type: string
        - in: query
          name: page
          description: 0부터 센다
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: 문제 목록
          content:
            application/json:
              schema:
                type: object
                required: [content, totalElements]
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminProblemSummary'
                  totalElements:
                    type: integer
                    format: int64
        '400':
          description: '`page`·`size` 범위 밖'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProblem
      summary: 문제 등록 (ADM-02·03)
      description: |
        문제와 1번 버전을 초안(`DRAFT`)으로 만든다. 사용자에게는 공개하기 전까지 보이지 않는다.
        `slug`는 서버가 만든다(`p-{id}`). 예제·테스트케이스는 `PUT /api/admin/problems/{id}/test-cases`로 넣는다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemInput'
      responses:
        '201':
          description: 등록됨
          headers:
            Location:
              description: 이 문제의 관리자 상세 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/ProblemInputInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/problems/{id}:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    get:
      operationId: getAdminProblem
      summary: 관리자 문제 상세 (ADM-02·03·06)
      description: |
        최신 버전의 내용과 공개 조건 충족 여부를 준다. 최신 버전은 초안이 있으면 초안, 없으면 가장 최근 버전이다.
        화면은 저장할 때마다 이 API를 다시 불러 공개 조건 체크리스트를 갱신한다.
        `/api/admin/problems/{id}` 아래 API는 모두 없는 문제에 404 `PROBLEM_NOT_FOUND`를 준다.
      tags: [admin]
      responses:
        '200':
          description: 최신 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblemDetail'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProblem
      summary: 문제 수정 (ADM-02·03·07)
      description: |
        폼 전체를 보낸다. 보낸 값이 그대로 저장되고, null은 그 칸을 비운다.
        어느 버전에 저장할지는 서버가 정한다.
        - 검증 중(`VALIDATING`)이면 409 `PROBLEM_VALIDATING`이다. 검증이 끝나 초안(`DRAFT`)으로 돌아온 뒤 고친다.
        - 초안이 있으면 초안을 고친다.
        - 초안이 없고 언어별 시간·메모리 제한이 최신 버전과 모두 같으면(언어 목록 포함) 최신 버전을 그 자리에서 고친다. 공개 중이면 사용자 화면에 바로 반영된다.
        - 초안이 없고 언어별 시간·메모리 제한이 하나라도 다르거나 언어를 더하거나 빼면 최신 버전을 복사해 새 초안(버전 번호 +1)을 만들고 거기에 저장한다.
          예제·테스트케이스와 정답 코드도 복사하고, 정답 코드는 다시 검증해야 한다. 공개하기 전까지 사용자는 기존 버전을 푼다.
        두 관리자가 같은 문제를 동시에 고치면 나중에 저장한 쪽이 이긴다.
        공개 중인 버전을 그 자리에서 고칠 때 공개 조건이 깨지면(태그를 모두 빼거나 출처를 비움) 409 `PUBLISH_CONDITIONS_NOT_MET`이다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemInput'
      responses:
        '200':
          description: 저장됨. 저장된 버전을 준다
          content:
            application/json:
              schema:
                type: object
                required: [versionNo, status]
                properties:
                  versionNo:
                    type: integer
                  status:
                    $ref: '#/components/schemas/ProblemVersionStatus'
        '400':
          $ref: '#/components/responses/ProblemInputInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: |
            오류 `code`: `PUBLISH_CONDITIONS_NOT_MET`(공개 버전을 고치다 공개 조건이 깨짐. `unmetConditions`를 준다),
            `PROBLEM_VALIDATING`(검증 중).
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetail'
                  - type: object
                    properties:
                      unmetConditions:
                        type: array
                        description: '`PUBLISH_CONDITIONS_NOT_MET`일 때만 있다'
                        items:
                          $ref: '#/components/schemas/PublishCondition'
    delete:
      operationId: deleteProblem
      summary: 문제 삭제
      description: |
        사용자 기록(제출·풀이 통계·리포트 추천)이 없는 문제만 지운다. 잘못 만든 문제를 정리할 때 쓴다.
        예제 실행과 관리자의 정답 코드 검증 기록은 사용자 기록으로 세지 않고 함께 지운다.
        기록이 있으면 409 `PROBLEM_IN_USE`다. 사용자에게서 내리려면 비공개(`unpublish`)를 쓴다.
        정답 코드를 검증하는 중(`VALIDATING`)이면 409 `PROBLEM_VALIDATING`이다. 검증은 늘 끝나므로 끝난 뒤 지운다.
      tags: [admin]
      responses:
        '204':
          description: 삭제됨
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: '오류 `code`: `PROBLEM_IN_USE`(사용자 기록이 있음), `PROBLEM_VALIDATING`(검증 중)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/problems/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    post:
      operationId: publishProblem
      summary: 공개 (ADM-06)
      description: |
        최신 버전을 공개한다. 이전 공개 버전은 지난 버전(`RETIRED`)이 된다. 비공개로 내린 버전이 최신이면 다시 공개한다.
        공개 조건을 모두 채워야 한다. 못 채우면 409 `PUBLISH_CONDITIONS_NOT_MET`과 `unmetConditions`를 준다.
        이미 최신 버전이 공개 중이면 아무것도 바꾸지 않고 204다.
      tags: [admin]
      responses:
        '204':
          description: 공개됨
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/PublishConditionsNotMet'

  /api/admin/problems/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    post:
      operationId: unpublishProblem
      summary: 비공개
      description: |
        공개 중인 버전을 `RETIRED`로 바꾼다. 사용자 목록에서 사라지고 상세·제출·예제 실행은 404가 된다. 기존 제출 기록은 남는다.
        초안이 있으면 초안은 그대로 둔다. 공개 중인 버전이 없으면 아무것도 바꾸지 않고 204다.
      tags: [admin]
      responses:
        '204':
          description: 비공개됨
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'

  /api/admin/problems/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    get:
      operationId: listProblemVersions
      summary: 버전 목록 (ADM-07)
      description: 최신 버전부터 준다.
      tags: [admin]
      responses:
        '200':
          description: 버전 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProblemVersionSummary'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'

  /api/admin/problems/{id}/versions/{versionNo}:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
      - in: path
        name: versionNo
        required: true
        schema:
          type: integer
    get:
      operationId: getProblemVersion
      summary: 버전 내용 보기 (ADM-07)
      description: 고른 버전의 내용을 준다. 읽기 전용이다. 없는 문제나 버전은 404 `PROBLEM_NOT_FOUND`다.
      tags: [admin]
      responses:
        '200':
          description: 그 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblemVersion'
        '400':
          description: '`id`나 `versionNo`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'

  /api/admin/problems/{id}/test-cases:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    get:
      operationId: listTestCases
      summary: 테스트케이스 목록 (ADM-04)
      description: |
        최신 버전(`GET /api/admin/problems/{id}`와 같은 버전)의 공개 예제와 비공개 테스트케이스를 순서대로 준다.
        비공개 케이스도 그대로 주므로 관리자 API에만 있다.
        케이스마다 정답 코드 검증 결과(`validation`)를 함께 준다(ADM-04 상태 칸, ADM-05 결과 표). 검증 중에는 이 API 대신 `GET /api/admin/problems/{id}/solutions`로 진행을 본다.
      tags: [admin]
      responses:
        '200':
          description: 케이스 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTestCase'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceTestCases
      summary: 테스트케이스 저장 (ADM-04·07)
      description: |
        화면의 케이스 표 전체를 보낸다. 그 버전의 케이스를 보낸 목록으로 통째로 바꾸고, 순서는 목록 순서다.
        공개 예제와 비공개 케이스가 섞여도 된다. 채점은 이 순서와 상관없이 공개 예제를 먼저 돌린다.
        어느 버전에 저장할지는 서버가 정한다.
        - 검증 중(`VALIDATING`)이면 409 `PROBLEM_VALIDATING`이다.
        - 보낸 목록이 최신 버전의 케이스와 똑같으면 아무것도 바꾸지 않는다.
        - 최신 버전이 초안이면 그 초안에 저장한다. 정답 코드 검증 기록을 지우므로 다시 검증해야 한다.
        - 최신 버전이 공개 중이거나 비공개면 최신 버전을 복사해 새 초안(버전 번호 +1)을 만들고 거기에 저장한다.
          정답 코드도 복사하고, 정답 코드는 다시 검증해야 한다. 기존 버전과 사용자 제출 기록은 그대로다. 공개하기 전까지 사용자는 기존 버전을 푼다.
        크기 제한(추후 조정할 수 있음): 케이스 10개, 입력 2MiB(2,097,152바이트), 기대 출력 1MiB(1,048,576바이트),
        모든 케이스의 입력·기대 출력 합 10MiB. 크기는 UTF-8 바이트로 센다. 기대 출력 상한은 채점 서버의 출력 상한과 같다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/TestCaseInput'
      responses:
        '200':
          description: 저장됨. 저장된 버전을 준다
          content:
            application/json:
              schema:
                type: object
                required: [versionNo, status]
                properties:
                  versionNo:
                    type: integer
                  status:
                    $ref: '#/components/schemas/ProblemVersionStatus'
        '400':
          $ref: '#/components/responses/TestCasesInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: '오류 `code`: `PROBLEM_VALIDATING`(검증 중)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/problems/{id}/test-cases/zip:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    post:
      operationId: readTestCaseZip
      summary: 테스트케이스 ZIP 읽기 (ADM-04)
      description: |
        ZIP을 풀어 케이스 목록으로 돌려준다. 저장하지 않는다. 화면은 이 목록으로 표를 채우고, 저장은 `PUT /api/admin/problems/{id}/test-cases`로 한다.
        ZIP 안 파일 규칙:
        - `sample/N.in`·`sample/N.out`은 공개 예제, `hidden/N.in`·`hidden/N.out`은 비공개 케이스다. 같은 `N`의 `.in`과 `.out`이 한 쌍이다.
        - `N`은 1 이상의 정수다. 순서는 `sample` 먼저, 그 안에서 `N`의 숫자 순서다(`2`가 `10`보다 앞). 번호가 비어도 되고, 저장할 때 1부터 새로 매긴다. 같은 번호가 두 번 있으면(`1.in`·`01.in`) 안 된다.
        - 맨 위에 폴더가 하나 더 있어도 된다(`cases/sample/1.in`). 폴더 항목, `__MACOSX/`, `.DS_Store`는 무시한다.
        - 항목은 무시하는 것까지 합쳐 100개까지 읽는다. 케이스가 하나도 없으면 `ZIP_INVALID`다.
        - 파일은 UTF-8 글자여야 한다. 맨 앞의 BOM(`EF BB BF`)은 지운다.
        짝이 없거나 규칙 밖의 파일이 있으면 400 `ZIP_INVALID`이고 `detail`에 파일 이름을 적는다.
        크기 제한은 저장(`PUT`)과 같고, 넘으면 400 `TEST_CASE_LIMIT_EXCEEDED`다. ZIP 파일 자체도 10MiB까지고, 넘으면 `code` 없는 413이다. 화면은 올리기 전에 파일 크기를 확인해 막는다.
      tags: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP 파일
      responses:
        '200':
          description: 읽은 케이스 목록. 저장 본문과 같은 모양이다
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestCaseInput'
        '400':
          $ref: '#/components/responses/TestCasesInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          description: ZIP 파일이 10MiB를 넘음. 화면이 막으므로 `code`가 없다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/problems/{id}/solutions:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    get:
      operationId: listSolutions
      summary: 정답 코드와 검증 상태 (ADM-05)
      description: |
        최신 버전의 정답 코드를 언어 순서(Python → C++)로 준다. 없는 언어는 빠진다.
        언어마다 검증 상태와 진행률을 함께 준다. 검증 중에는 화면이 이 API만 다시 불러 진행을 보여 주고,
        끝나면 `GET /api/admin/problems/{id}/test-cases`를 한 번 받아 케이스별 결과를 그린다.
      tags: [admin]
      responses:
        '200':
          description: 정답 코드 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSolution'
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceSolutions
      summary: 정답 코드 저장 (ADM-05)
      description: |
        탭 전체를 보낸다. 언어마다 하나씩 0~2개이고, 목록에 없거나 코드가 비어 있으면(공백뿐 포함) 그 언어의 정답 코드를 지운다.
        저장만 하고 실행하지 않는다. 실행은 `POST /api/admin/problems/{id}/validate`로 한다.
        어느 버전에 저장할지는 테스트케이스 저장(`replaceTestCases`)과 같다.
        - 검증 중(`VALIDATING`)이면 409 `PROBLEM_VALIDATING`이다.
        - 보낸 코드가 최신 버전과 똑같으면 아무것도 바꾸지 않는다.
        - 최신 버전이 초안이면 그 초안에 저장한다. 정답 코드 검증 기록을 지우므로 다시 검증해야 한다.
        - 최신 버전이 공개 중이거나 비공개면 최신 버전을 복사해 새 초안(버전 번호 +1)을 만들고 거기에 저장한다.
          공개 버전은 검증된 정답 코드를 그대로 가진다.
        코드는 하나당 64KB(65,536바이트, UTF-8)까지다. 넘으면 400 `SOURCE_TOO_LONG`이다.
        언어가 `PYTHON`·`CPP`가 아니거나, 같은 언어가 두 번 있거나, null 칸이나 NUL 글자가 있으면 `code` 없는 400이다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 2
              items:
                $ref: '#/components/schemas/SolutionInput'
      responses:
        '200':
          description: 저장됨. 저장된 버전을 준다
          content:
            application/json:
              schema:
                type: object
                required: [versionNo, status]
                properties:
                  versionNo:
                    type: integer
                  status:
                    $ref: '#/components/schemas/ProblemVersionStatus'
        '400':
          description: '오류 `code`: `SOURCE_TOO_LONG`(64KB 초과). 그 밖의 규칙은 `code` 없는 400이다'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: '오류 `code`: `PROBLEM_VALIDATING`(검증 중)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/problems/{id}/validate:
    parameters:
      - $ref: '#/components/parameters/AdminProblemId'
    post:
      operationId: validateSolutions
      summary: 정답 코드 검증 시작 (ADM-05)
      description: |
        최신 초안의 정답 코드를 모두 그 초안의 테스트케이스로 채점한다. 학생 제출과 같은 채점 대기열을 쓰고 바로 `202`로 답한다.
        시작하면 이전 검증 기록을 지우고 정답 코드의 검증 통과 표시를 비운 뒤, 버전을 `VALIDATING`으로 바꾼다.
        검증 중에는 저장·삭제가 409 `PROBLEM_VALIDATING`이고, 공개는 `SOLUTIONS_VERIFIED`를 못 채워 409다.
        정답 코드마다 채점이 끝나면 모든 케이스를 통과한 코드만 검증 통과가 되고, 모두 끝나면 버전이 `DRAFT`로 돌아온다.
        채점이 실패해도(채점 불가) `DRAFT`로 돌아온다. 진행은 `GET /api/admin/problems/{id}/solutions`로 본다.
        "저장하고 검증"은 화면이 `PUT .../solutions` 다음에 이 API를 부른다.
      tags: [admin]
      responses:
        '202':
          description: 검증을 시작함
        '400':
          description: '`id`가 정수가 아님'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: |
            오류 `code`: `PROBLEM_VALIDATING`(이미 검증 중), `NOT_DRAFT`(최신 버전이 초안이 아님. 공개·비공개 버전은 검증을 통과한 버전이다),
            `NO_SOLUTION`(정답 코드가 없음), `NO_TEST_CASES`(테스트케이스가 없음),
            `LANGUAGE_NOT_CONFIGURED`(정답 코드 언어의 시간·메모리 제한이 없음. `detail`에 언어를 적는다).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: '오류 `code`: `JUDGE_UNAVAILABLE`. 이 서버에 채점 서버가 설정되지 않아 검증할 수 없음(로컬 개발 등)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/admin/concept-tags:
    post:
      operationId: createConceptTag
      summary: 개념 태그 등록 (ADM-02)
      description: |
        `slug`는 영문 소문자·숫자를 `-`로 이은 것이다(예: `binary-search`). 문제 목록 주소의 태그 필터에 쓰이고 바꿀 수 없다.
        `name`이나 `slug`가 이미 있으면 409 `CONCEPT_TAG_EXISTS`다.
        `name`은 앞뒤 공백을 지우고 저장하고, 중복도 지운 값으로 비교한다.
        태그 목록은 `GET /api/concept-tags`로 본다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptTagInput'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptTag'
        '400':
          description: '`slug` 형식이 틀리거나 `name`이 비었거나 너무 김. 화면이 막으므로 `code` 없는 400이다'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AdminProblemId:
      in: path
      name: id
      required: true
      description: 문제 번호
      schema:
        type: integer
        format: int64

  schemas:
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CurrentUser:
      type: object
      required: [id, nickname, role]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        avatarUrl:
          type: [string, 'null']
          description: GitHub 가입 계정의 프로필 이미지. 없으면 null

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    Language:
      type: string
      enum: [PYTHON, CPP]

    SolveStatus:
      type: string
      enum: [SOLVED, WRONG, UNSOLVED]
      description: |
        내 풀이 상태 (LIST-01). 판정이 나온 채점 제출만 센다(예제 실행·채점 불가·채점 중인 제출은 세지 않는다).
        `SOLVED` 한 번이라도 맞음, `WRONG` 제출했지만 맞은 적 없음, `UNSOLVED` 제출 기록 없음.

    ConceptTag:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    ProblemSummary:
      type: object
      required: [id, slug, title, difficulty, tags]
      properties:
        id:
          type: integer
          format: int64
          description: 화면에 보여 주는 문제 번호
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ConceptTag'
        solveStatus:
          $ref: '#/components/schemas/SolveStatus'
          description: 로그인한 요청에만 있다. 비로그인이면 필드가 없다(`UNSOLVED`와 다르다).

    ProblemDetailView:
      type: object
      required: [id, slug, versionNo, title, difficulty, tags, statementMarkdown, inputDescription,
        outputDescription, constraintsMarkdown, sourceName, sourceUrl, license, samples, languages]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        versionNo:
          type: integer
          description: 공개된 버전의 번호 (SOLVE-03)
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ConceptTag'
        statementMarkdown:
          type: string
          description: 지문. Markdown과 수식
        inputDescription:
          type: string
          description: 입력 형식. Markdown과 수식
        outputDescription:
          type: string
          description: 출력 형식. Markdown과 수식
        constraintsMarkdown:
          type: string
          description: 제약 조건. 없으면 빈 문자열
        sourceName:
          type: [string, 'null']
        sourceUrl:
          type: [string, 'null']
        license:
          type: [string, 'null']
        samples:
          type: array
          description: 공개 예제. 순서대로
          items:
            type: object
            required: [input, output]
            properties:
              input:
                type: string
              output:
                type: string
        languages:
          type: array
          description: 쓸 수 있는 언어. PYTHON, CPP 순서
          items:
            type: object
            required: [language, timeLimitMs, memoryLimitMb, starterCode]
            properties:
              language:
                $ref: '#/components/schemas/Language'
              timeLimitMs:
                type: integer
              memoryLimitMb:
                type: integer
              starterCode:
                type: string
                description: 에디터의 시작 코드. 없으면 빈 문자열

    ProblemPage:
      type: object
      required: [content, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        totalElements:
          type: integer
          format: int64
          description: 페이지와 상관없이 조건에 맞는 문제 수

    SubmissionResult:
      type: object
      required: [id, problemId, problemTitle, language, status, progress, verdict, runtimeErrorType, runtimeErrorMessage,
        compilerMessage, executionTimeMs, memoryUsedKb, submittedAt, judgedAt]
      properties:
        id:
          type: integer
          format: int64
          description: 제출 번호
        problemId:
          type: integer
          format: int64
        problemTitle:
          type: string
          description: 제출한 버전의 제목. 제목 수정은 버전을 늘리지 않아 그 뒤 고친 제목일 수 있다
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [QUEUED, COMPILING, RUNNING, COMPLETED, JUDGE_ERROR]
          description: |
            `QUEUED` 기다리는 중, `COMPILING` 채점 준비 중, `RUNNING` 채점 중(`progress` %), `COMPLETED` 판정이 남, `JUDGE_ERROR` 채점 불가.
            채점 불가는 서버 문제라 `verdict`가 null이고 시도 횟수에 넣지 않는다(RES-06).
        progress:
          type: integer
          minimum: 0
          maximum: 100
        verdict:
          type: [string, 'null']
          enum: [ACCEPTED, PRESENTATION_ERROR, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED,
            OUTPUT_LIMIT_EXCEEDED, RUNTIME_ERROR, COMPILE_ERROR, null]
          description: '`COMPLETED`일 때만 있다'
        runtimeErrorType:
          type: [string, 'null']
          enum: [INDEX_ERROR, ZERO_DIVISION, VALUE_ERROR, NAME_ERROR, TYPE_ERROR, RECURSION_ERROR, EOF_ERROR, OTHER, null]
          description: '`verdict`가 `RUNTIME_ERROR`일 때만 있다. 값은 `docs/judge-verdict-mapping.md` 4절'
        runtimeErrorMessage:
          type: [string, 'null']
          description: |
            런타임 에러를 낸 테스트가 공개 예제일 때만 있는 에러 원문(줄 번호 포함, RES-04). 비공개 테스트에서 났으면 null이고 종류만 보여 준다.
            C++ Segfault처럼 원문이 없으면 null이다. 학생 코드가 만든 문자열이라 글자 그대로 보여 준다(HTML로 렌더링하지 않는다).
        compilerMessage:
          type: [string, 'null']
          description: '`verdict`가 `COMPILE_ERROR`일 때 줄 번호가 든 메시지(RES-05). 글자 그대로 보여 준다'
        executionTimeMs:
          type: [integer, 'null']
          description: 판정이 난 테스트 중 가장 긴 실행 시간. 컴파일 에러·채점 불가면 null
        memoryUsedKb:
          type: [integer, 'null']
          description: 판정이 난 테스트 중 가장 큰 메모리. 컴파일 에러·채점 불가면 null
        submittedAt:
          type: string
          format: date-time
        judgedAt:
          type: [string, 'null']
          format: date-time

    SampleRunResult:
      type: object
      required: [id, problemId, language, status, progress, verdict, runtimeErrorType, compilerMessage,
        submittedAt, judgedAt, cases]
      properties:
        id:
          type: integer
          format: int64
          description: 예제 실행 번호
        problemId:
          type: integer
          format: int64
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [QUEUED, COMPILING, RUNNING, COMPLETED, JUDGE_ERROR]
          description: '`SubmissionResult.status`와 같다. `RUNNING`이면 `progress` %'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        verdict:
          type: [string, 'null']
          enum: [ACCEPTED, PRESENTATION_ERROR, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED,
            OUTPUT_LIMIT_EXCEEDED, RUNTIME_ERROR, COMPILE_ERROR, null]
          description: 예제 전체의 판정. 모두 맞으면 `ACCEPTED`, 아니면 처음 틀린 예제의 판정. `COMPLETED`일 때만 있다
        runtimeErrorType:
          type: [string, 'null']
          enum: [INDEX_ERROR, ZERO_DIVISION, VALUE_ERROR, NAME_ERROR, TYPE_ERROR, RECURSION_ERROR, EOF_ERROR, OTHER, null]
          description: '`verdict`가 `RUNTIME_ERROR`일 때만 있다. 값은 `docs/judge-verdict-mapping.md` 4절'
        compilerMessage:
          type: [string, 'null']
          description: '`verdict`가 `COMPILE_ERROR`일 때 줄 번호가 든 메시지(RES-05). 이때 예제별 `verdict`는 모두 null이다. 글자 그대로 보여 준다'
        submittedAt:
          type: string
          format: date-time
        judgedAt:
          type: [string, 'null']
          format: date-time
        cases:
          type: array
          description: 공개 예제 전부. 실행 전인 예제도 있고 결과 값이 null이다
          items:
            type: object
            required: [ordinal, actualOutput, verdict, errorMessage, executionTimeMs, memoryUsedKb]
            properties:
              ordinal:
                type: integer
                minimum: 1
                description: 문제 상세 `samples`의 순서(1부터)
              actualOutput:
                type: [string, 'null']
                description: 프로그램의 실제 출력. 최대 65,536자이고 깨진 바이트·NUL은 U+FFFD로 바뀐다
              verdict:
                type: [string, 'null']
                enum: [ACCEPTED, PRESENTATION_ERROR, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED,
                  OUTPUT_LIMIT_EXCEEDED, RUNTIME_ERROR, null]
                description: 이 예제의 판정. 실행 전이거나 컴파일 에러·채점 불가로 끝나 실행되지 않았으면 null
              errorMessage:
                type: [string, 'null']
                description: |
                  프로그램이 낸 에러 원문(줄 번호 포함, RES-04). 공개 예제라 그대로 준다.
                  C++ Segfault처럼 원문이 없으면 null이다. 학생 코드가 만든 문자열이라 글자 그대로 보여 준다(HTML로 렌더링하지 않는다).
              executionTimeMs:
                type: [integer, 'null']
              memoryUsedKb:
                type: [integer, 'null']

    ProblemVersionStatus:
      type: string
      enum: [DRAFT, VALIDATING, PUBLISHED, RETIRED]
      description: |
        `DRAFT` 초안(작성 중), `VALIDATING` 정답 코드 검증 중(#35), `PUBLISHED` 공개 중,
        `RETIRED` 지난 버전이거나 비공개로 내린 버전. 문제마다 `PUBLISHED`는 하나뿐이다.

    PublishCondition:
      type: string
      enum: [SAMPLE_COUNT, HIDDEN_COUNT, TAG_COUNT, SOURCE, LANGUAGES, SOLUTIONS_VERIFIED]
      description: |
        공개 조건 (ADM-06). `SAMPLE_COUNT` 공개 예제 2개 이상, `HIDDEN_COUNT` 비공개 테스트케이스 5개 이상,
        `TAG_COUNT` 개념 태그 1~3개, `SOURCE` 출처(`sourceName`) 입력, `LANGUAGES` Python·C++ 언어 설정이 둘 다 있음,
        `SOLUTIONS_VERIFIED` Python·C++ 정답 코드가 둘 다 있고 둘 다 검증을 통과함.

    ProblemInput:
      type: object
      description: 등록·수정 본문. 글은 받은 그대로(앞뒤 공백·줄바꿈 포함) 저장한다.
      required: [title, difficulty, statementMarkdown, inputDescription, outputDescription, constraintsMarkdown,
        sourceName, sourceUrl, license, tags, languages]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 공백뿐이면 안 된다
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        statementMarkdown:
          type: string
          description: 지문. Markdown과 수식. 초안에서는 비어도 된다
        inputDescription:
          type: string
        outputDescription:
          type: string
        constraintsMarkdown:
          type: string
          description: 없으면 빈 문자열
        sourceName:
          type: [string, 'null']
          maxLength: 200
        sourceUrl:
          type: [string, 'null']
          description: '`http://`나 `https://`로 시작해야 한다. 사용자 화면에 링크로 나간다'
        license:
          type: [string, 'null']
          maxLength: 120
        tags:
          type: array
          maxItems: 3
          uniqueItems: true
          description: 개념 태그 `slug` (`GET /api/concept-tags`). 초안에서는 비어도 되고, 공개하려면 1개 이상이어야 한다
          items:
            type: string
        languages:
          type: array
          maxItems: 2
          description: 언어마다 하나씩. 초안에서는 하나만 있거나 비어도 되고, 공개하려면 PYTHON과 CPP가 둘 다 있어야 한다
          items:
            type: object
            required: [language, timeLimitMs, memoryLimitMb, starterCode]
            properties:
              language:
                $ref: '#/components/schemas/Language'
              timeLimitMs:
                type: integer
                minimum: 1
                description: |
                  채점 서버 상한(`MAX_CPU_TIME_LIMIT`, 지금 20초) 이하. Python은 보정한 값을 그대로 넣는다(`docs/judge-verdict-mapping.md` 1절).
              memoryLimitMb:
                type: integer
                minimum: 2
                description: 채점 서버 상한(`MAX_MEMORY_LIMIT`, 지금 512MB) 이하
              starterCode:
                type: string
                description: 없으면 빈 문자열

    AdminProblemSummary:
      type: object
      required: [id, slug, title, difficulty, latestVersionNo, latestStatus, publishedVersionNo]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
          description: 최신 버전의 제목
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        latestVersionNo:
          type: integer
        latestStatus:
          $ref: '#/components/schemas/ProblemVersionStatus'
        publishedVersionNo:
          type: [integer, 'null']
          description: 공개 중인 버전 번호. 없으면 null

    ProblemVersionSummary:
      type: object
      required: [versionNo, status, createdAt, publishedAt]
      properties:
        versionNo:
          type: integer
        status:
          $ref: '#/components/schemas/ProblemVersionStatus'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: 마지막으로 공개한 시각. 공개한 적이 없으면 null

    AdminProblemVersion:
      description: 버전 하나의 내용. 필드 뜻은 `ProblemInput`과 같다
      allOf:
        - $ref: '#/components/schemas/ProblemInput'
        - $ref: '#/components/schemas/ProblemVersionSummary'
        - type: object
          required: [id, slug]
          properties:
            id:
              type: integer
              format: int64
              description: 문제 번호
            slug:
              type: string

    AdminProblemDetail:
      allOf:
        - $ref: '#/components/schemas/AdminProblemVersion'
        - type: object
          required: [publishedVersionNo, unmetConditions]
          properties:
            publishedVersionNo:
              type: [integer, 'null']
              description: 공개 중인 버전 번호. 없으면 null
            unmetConditions:
              type: array
              description: 이 버전이 아직 못 채운 공개 조건. 비어 있으면 공개할 수 있다(ADM-06 [공개하기] 활성화)
              items:
                $ref: '#/components/schemas/PublishCondition'

    TestCaseInput:
      type: object
      description: 케이스 하나. 글은 받은 그대로(앞뒤 공백·줄바꿈 포함) 저장한다
      required: [caseType, input, output]
      properties:
        caseType:
          type: string
          enum: [SAMPLE, HIDDEN]
          description: '`SAMPLE` 공개 예제(문제 화면에 보임), `HIDDEN` 비공개(채점에만 씀)'
        input:
          type: string
          description: 프로그램에 넣을 입력. 비어도 된다
        output:
          type: string
          description: 기대 출력. 비어도 된다

    AdminTestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseInput'
        - type: object
          required: [inputBytes, outputBytes, validation]
          properties:
            validation:
              type: object
              description: 언어별 정답 코드 검증 결과. 그 언어의 검증 결과가 없으면(검증 전·정답 코드 없음·아직 이 케이스를 안 돌림) null
              required: [PYTHON, CPP]
              properties:
                PYTHON:
                  oneOf:
                    - $ref: '#/components/schemas/CaseValidation'
                    - type: 'null'
                CPP:
                  oneOf:
                    - $ref: '#/components/schemas/CaseValidation'
                    - type: 'null'
            inputBytes:
              type: integer
              description: '`input`의 UTF-8 바이트 수'
            outputBytes:
              type: integer
              description: '`output`의 UTF-8 바이트 수'

    ConceptTagInput:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: '화면에 보이는 이름(예: 이분 탐색). 공백뿐이면 안 된다. 앞뒤 공백은 지우고 저장한다'

    SolutionInput:
      type: object
      required: [language, sourceCode]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        sourceCode:
          type: string
          description: 비어 있으면(공백뿐 포함) 그 언어의 정답 코드를 지운다

    AdminSolution:
      type: object
      description: 정답 코드 하나와 그 검증 상태. 관리자 API에만 있다
      required: [language, sourceCode, verifiedAt, status, progress, verdict, compilerMessage]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        sourceCode:
          type: string
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: 모든 케이스를 통과한 시각. 통과 전이면 null
        status:
          type: string
          enum: [NOT_VALIDATED, VALIDATING, PASSED, FAILED, JUDGE_ERROR]
          description: |
            `NOT_VALIDATED` 검증 전(저장 뒤 아직 검증하지 않음), `VALIDATING` 검증 중, `PASSED` 모든 케이스 통과,
            `FAILED` 통과하지 못한 케이스가 있음, `JUDGE_ERROR` 채점 불가(서버 문제라 다시 검증한다).
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 검증 전은 0, 검증 중은 진행률, 끝나면 100
        verdict:
          type: [string, 'null']
          enum: [ACCEPTED, PRESENTATION_ERROR, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED,
            OUTPUT_LIMIT_EXCEEDED, RUNTIME_ERROR, COMPILE_ERROR, null]
          description: '`PASSED`·`FAILED`일 때 대표 판정(처음 틀린 케이스의 판정). 그 밖에는 null'
        compilerMessage:
          type: [string, 'null']
          description: '`verdict`가 `COMPILE_ERROR`일 때 컴파일러 메시지'

    CaseValidation:
      type: object
      description: 케이스 하나를 정답 코드 하나로 돌린 결과. 필드 뜻은 `SubmissionResult`와 같다
      required: [verdict, executionTimeMs, memoryUsedKb, runtimeErrorType]
      properties:
        verdict:
          type: [string, 'null']
          enum: [ACCEPTED, PRESENTATION_ERROR, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED,
            OUTPUT_LIMIT_EXCEEDED, RUNTIME_ERROR, null]
          description: 실행 전이거나 컴파일 에러·채점 불가로 이 케이스를 실행하지 않았으면 null
        executionTimeMs:
          type: [integer, 'null']
        memoryUsedKb:
          type: [integer, 'null']
        runtimeErrorType:
          type: [string, 'null']
          enum: [INDEX_ERROR, ZERO_DIVISION, VALUE_ERROR, NAME_ERROR, TYPE_ERROR, RECURSION_ERROR, EOF_ERROR, OTHER, null]
          description: '`verdict`가 `RUNTIME_ERROR`일 때만 있다'

    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 화면이 경우를 나눌 때 쓰는 오류 코드. `detail`은 화면에 그대로 보여 줄 문구다.

  responses:
    TokensIssued:
      description: 로그인됨. access token은 본문, refresh token은 쿠키로 준다.
      headers:
        Set-Cookie:
          description: refresh token
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenResponse'

    Problem:
      description: 요청을 처리하지 못함. `code`와 `detail`을 본다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: 토큰이 없거나 유효하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: ADMIN이 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ProblemInputInvalid:
      description: |
        본문이 규칙에 맞지 않음. 오류 `code`: `TAG_NOT_FOUND`(없는 태그 `slug`),
        `LIMIT_OUT_OF_RANGE`(시간·메모리 제한이 채점 서버 상한 밖. `detail`에 범위를 적는다).
        그 밖의 규칙(빈 제목, 태그 4개 이상, 같은 언어 두 번, `http(s)`가 아닌 URL)은 화면이 막으므로 `code` 없는 400이다.
        수정에서 경로의 `id`가 정수가 아닐 때도 `code` 없는 400이다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    TestCasesInvalid:
      description: |
        케이스가 규칙에 맞지 않음. 오류 `code`: `TEST_CASE_LIMIT_EXCEEDED`(개수·크기 제한을 넘음. `detail`에 어느 케이스가 얼마나 넘었는지 적는다. 저장은 표의 몇 번째 줄, ZIP 읽기는 파일 이름이다),
        `ZIP_INVALID`(ZIP 읽기에서만. ZIP이 아니거나 파일 규칙에 맞지 않음. `detail`에 파일 이름을 적는다).
        그 밖의 규칙(null인 칸, NUL 글자)은 `code` 없는 400이다. 경로의 `id`가 정수가 아닐 때도 `code` 없는 400이다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    PublishConditionsNotMet:
      description: |
        오류 `code`: `PUBLISH_CONDITIONS_NOT_MET`. 못 채운 공개 조건을 `unmetConditions`로 준다.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetail'
              - type: object
                required: [unmetConditions]
                properties:
                  unmetConditions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishCondition'

security:
  - bearerAuth: []
