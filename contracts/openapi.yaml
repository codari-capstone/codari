openapi: 3.1.0
info:
  title: codingmon API
  version: 0.1.0
  description: |
    인증: 로그인하면 access token(JWT, 30분)을 응답 본문으로, refresh token(7일)을
    `refresh_token` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/auth)로 준다.
    프런트는 access token을 메모리에만 두고 `Authorization: Bearer <token>`으로 보낸다.
    access token이 만료되거나 비밀번호 재설정으로 무효가 되면 401을 받는다. 그러면
    `POST /api/auth/refresh`로 갱신하고, 갱신도 401이면 로그인 화면으로 보낸다 (COM-04).

    권한 (COM-05): 비로그인은 `GET /api/problems`(목록), `GET /api/concept-tags`만 쓸 수 있다.
    문제 상세(지문)는 로그인해야 본다.
    `/api/admin/**`는 ADMIN만 쓸 수 있다. 나머지는 로그인이 필요하다.

    오류 응답은 RFC 9457 `application/problem+json`이다.

servers:
  - url: /

paths:
  /api/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: access token 갱신 (COM-04)
      description: |
        refresh token 쿠키로 새 access token을 받는다. refresh token도 새 값으로 바뀐다.
        바뀐 지 10초 안의 refresh token을 다시 보내면 401만 준다. 다른 탭이 먼저 갱신한 경우이므로
        프런트는 한 번 다시 시도한다(쿠키는 이미 새 값이다).
        그보다 오래된 refresh token을 다시 보내면 탈취로 보고, 같은 로그인에서 나온 토큰을 모두 폐기한다.
      tags: [auth]
      security: []
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 새 refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    Unauthorized:
      description: 토큰이 없거나 유효하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

security:
  - bearerAuth: []
