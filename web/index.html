<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codingmon</title>
    <!--
      테마를 번들보다 먼저 정한다.

      main.tsx는 (목 모드면 MSW를 띄운 뒤) App을 동적 import한 다음에야 렌더하므로,
      ThemeProvider의 useLayoutEffect는 그 전 구간을 덮지 못한다. 그 사이에는
      index.css의 :root(라이트) 값으로 칠해져, 다크를 저장해 둔 사용자가 새로고침하면
      청크가 도착할 때까지 흰 배경을 본다.

      src/app/theme.ts의 resolveInitialTheme·applyTheme과 같은 규칙이다. 저장 키를
      바꾸면 두 곳을 함께 고쳐야 한다. e2e/layout.spec.ts가 번들을 막은 채
      이 스크립트만으로 클래스가 붙는지 검사한다.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('codari-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage 접근이 막힌 브라우저. 기본값(라이트)으로 둔다.
        }
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!--
      글꼴 CSS를 렌더 차단 자원으로 두지 않는다. media="print"로 받아 두고 onload에서
      적용 대상으로 바꾼다. 일반 stylesheet로 두면 cdn.jsdelivr.net이 막힌 사내망·CI에서
      응답을 기다리는 동안 첫 페인트가 밀리고, load를 기다리는 Playwright page.goto도
      함께 지연된다. 이 글꼴은 font-display:swap이라 늦게 와도 폴백에서 자연히 바뀐다.

      integrity는 커밋 SHA 고정과 별개로 내용까지 검증한다(같은 URL을 두 번 받아 해시가
      동일함을 확인했다). 다만 이 CSS가 참조하는 92개 서브셋 woff2에는 적용되지 않는다 —
      선택자와 url()을 이용한 변조를 막는 것이 목적이다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@5c41199ea0024a9e0b2cb31735265056e5472d76/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      integrity="sha384-5aKQt3hR1ZMe2PuqrGxr7RHHgq6ITxfLV+pFi+b7PCqH4SqKIkcztfpLHg97YgbB"
      crossorigin="anonymous"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
