# 웹 컨테이너 nginx 설정. 화면과 API를 한 주소로 내보낸다(vite.config.ts 개발 프록시·운영 ALB와 같은 구조).

# 앞단(HTTPS를 끝내는 프록시)이 보낸 원래 scheme을 그대로 넘기고, 없으면 nginx가 받은 scheme을 쓴다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API의 RequestSizeLimitFilter(512 KB)보다 조금 크게 둬서 한도 응답은 API가 정하게 한다
    client_max_body_size 1m;

    # server 블록에 두면 아래 두 location이 그대로 물려받는다. location 한쪽에만 적으면
    # 그 location은 물려받은 것을 전부 버리므로 세 줄을 양쪽에 적어야 한다.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # 관리자 테스트케이스 저장·ZIP 읽기만 크게 받는다. RequestSizeLimitFilter가 이 두
    # 주소에만 24MiB·11MiB를 주므로(#34·#152), 1m에 걸리면 ZIP(최대 10MiB)은 API에
    # 닿지도 못하고 nginx가 413을 돌려준다. 한쪽 값만 두는 것은 상한을 API가 정한다는
    # 위 규칙을 지키는 쪽이다 — 넘치면 API가 `TEST_CASE_LIMIT_EXCEEDED`로 답한다.
    # 정규식 location이 접두사 location보다 먼저 맞아 /api/ 대신 이쪽이 쓰인다.
    location ~ ^/api/admin/problems/[^/]+/test-cases(/zip)?$ {
        client_max_body_size 24m;
        proxy_pass http://api:8080;
    }

    location /api/ {
        proxy_pass http://api:8080;
    }

    # Vite가 파일 이름에 해시를 붙이므로 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: 없는 경로는 index.html로 보내 클라이언트 라우터가 처리한다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
