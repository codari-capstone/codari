# 웹 컨테이너 nginx 설정. 화면과 API를 한 주소로 내보낸다(vite.config.ts 개발 프록시·운영 ALB와 같은 구조).

# 앞단(HTTPS를 끝내는 프록시)이 보낸 원래 scheme을 그대로 넘기고, 없으면 nginx가 받은 scheme을 쓴다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API의 RequestSizeLimitFilter(512 KB)보다 조금 크게 둬서 한도 응답은 API가 정하게 한다
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Vite가 파일 이름에 해시를 붙이므로 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: 없는 경로는 index.html로 보내 클라이언트 라우터가 처리한다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
